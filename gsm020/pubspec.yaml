name: gsm020_tracker
description: SkyRC GSM020 speed tracker - BLE, map track and speed per point.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: 1.34.5
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  share_plus: ^7.2.2
  wakelock_plus: ^1.1.4
  mqtt_client: ^10.2.1
  geolocator: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
