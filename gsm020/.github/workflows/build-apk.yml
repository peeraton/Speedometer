name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'

      # Generate the Android project files (keeps our lib/ and pubspec.yaml)
      - run: flutter create --org com.example --project-name gsm020_tracker --platforms=android .
      - run: cp android_overrides/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
      - run: rm -f test/widget_test.dart

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: gsm020-tracker-apk
          path: build/app/outputs/flutter-apk/app-release.apk
